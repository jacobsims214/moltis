{{- $root := . }}
{{- range $i := (include "moltis.instances" . | fromYamlArray) }}
{{- $c := $i.cfg }}
{{- $ctx := dict "root" $root "i" $i }}
{{- if and $c.password.value (lt (len $c.password.value) 12) }}
{{- fail (printf "instance %s: password must be at least 12 characters" $i.name) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $i.fullname }}-config
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
data:
  moltis.toml: |
    {{- include "moltis.configToml" $ctx | nindent 4 }}
  {{- $mcp := include "moltis.effectiveMcpServers" $ctx | fromYaml }}
  {{- if $mcp }}
  mcp-servers.json: |
    {{- include "moltis.mcpServersJson" $ctx | nindent 4 }}
  {{- end }}
  {{- range $name, $md := (include "moltis.toolsNotes" $ctx | fromYaml) }}
  notes-{{ $name }}.md: |
    {{- $md | nindent 4 }}
  {{- end }}
  {{- if $c.webTools.searxng.enabled }}
  searxng-settings.yml: |
    {{- include "moltis.searxngSettings" $ctx | nindent 4 }}
  {{- end }}
{{- if and $c.password.value (not $c.password.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $i.fullname }}-password
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{ $c.password.existingSecretKey }}: {{ $c.password.value | quote }}
{{- end }}
{{- if and $c.persistence.enabled (not $c.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $i.fullname }}
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
  {{- if $c.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ $c.persistence.accessMode }}
  {{- with $c.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $i.fullname }}
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ if $i.enabled }}1{{ else }}0{{ end }}
  # SQLite on one volume: never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "moltis.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moltis.selectorLabels" $ctx | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s%s%s" (include "moltis.configToml" $ctx) (include "moltis.mcpServersJson" $ctx) (include "moltis.searxngSettings" $ctx) | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed (or, with configOverwrite, replace) moltis.toml on the volume.
        - name: seed-config
          image: {{ include "moltis.instanceImage" $ctx }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /home/moltis/.config/moltis /home/moltis/.moltis /home/moltis/.npm
              {{- if $c.configOverwrite }}
              cp /seed/moltis.toml /home/moltis/.config/moltis/moltis.toml
              echo "moltis.toml replaced from chart"
              {{- else }}
              if [ ! -f /home/moltis/.config/moltis/moltis.toml ]; then
                cp /seed/moltis.toml /home/moltis/.config/moltis/moltis.toml
                echo "moltis.toml seeded from chart"
              else
                echo "moltis.toml exists, leaving it (configOverwrite=false)"
              fi
              {{- end }}
              {{- if $c.skipOnboarding }}
              # The SPA router only checks this marker (not SKIP_ONBOARDING).
              touch /home/moltis/.moltis/.onboarded
              {{- end }}
              {{- if $mcp }}
              # Merge chart MCP servers into the instance's list: add missing
              # ones, never remove or overwrite servers added in the UI.
              node -e '
                const fs = require("fs");
                const dst = "/home/moltis/.moltis/mcp-servers.json";
                const want = JSON.parse(fs.readFileSync("/seed/mcp-servers.json", "utf8")).servers;
                let cur = { servers: {} };
                try { cur = JSON.parse(fs.readFileSync(dst, "utf8")); cur.servers = cur.servers || {}; } catch {}
                const added = Object.keys(want).filter((k) => !(k in cur.servers));
                for (const k of added) cur.servers[k] = want[k];
                fs.writeFileSync(dst, JSON.stringify(cur, null, 2));
                console.log("mcp-servers.json: added", added.length ? added.join(", ") : "nothing");
              '
              {{- end }}
              # Tool notes for the agent, each appended once (keyed by its first
              # "## " heading). Moltis copies the root TOOLS.md to
              # agents/main/TOOLS.md on first start and reads only that copy
              # afterwards, so write to whichever file is live.
              T=/home/moltis/.moltis/agents/main/TOOLS.md
              [ -f "$T" ] || T=/home/moltis/.moltis/TOOLS.md
              for n in /seed/notes-*.md; do
                [ -f "$n" ] || continue
                h=$(grep -m1 '^## ' "$n")
                if [ -n "$h" ] && ! grep -qF "$h" "$T" 2>/dev/null; then
                  printf '\n' >> "$T"; cat "$n" >> "$T"; echo "TOOLS.md: added $h"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seed
              mountPath: /seed
            {{- include "moltis.volumeMounts" $ctx | nindent 12 }}
        # Web tools run as native sidecars (restartPolicy: Always): Kubernetes
        # starts them, waits for their startup probes, then starts Moltis, so
        # its MCP connections never race the servers.
        {{- if $c.webTools.searxng.enabled }}
        - name: searxng
          image: {{ $c.webTools.searxng.image }}
          restartPolicy: Always
          env:
            - name: GRANIAN_HOST
              value: "127.0.0.1"
            - name: GRANIAN_PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Bound to the pod's loopback, so probe from inside the container
          # (an httpGet host of 127.0.0.1 would be the node's loopback).
          startupProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml $c.webTools.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: seed
              mountPath: /etc/searxng/settings.yml
              subPath: searxng-settings.yml
              readOnly: true
            - name: searxng-cache
              mountPath: /var/cache/searxng
        - name: searxng-mcp
          image: {{ $c.webTools.searxng.mcpImage }}
          restartPolicy: Always
          startupProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3010/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            periodSeconds: 2
            failureThreshold: 60
          env:
            - name: SEARXNG_URL
              value: http://127.0.0.1:8080
            - name: MCP_HTTP_PORT
              value: "3010"
            - name: MCP_HTTP_HOST
              value: "127.0.0.1"
            - name: MCP_HTTP_STATELESS
              value: "true"
            - name: SEARXNG_TIMEOUT_MS
              value: "15000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $c.webTools.searxng.mcpResources | nindent 12 }}
        {{- end }}
        {{- if $c.webTools.playwright.enabled }}
        - name: playwright
          image: {{ $c.webTools.playwright.image }}
          restartPolicy: Always
          startupProbe:
            exec:
              command: ["node", "-e", "require('net').connect(8931, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
            periodSeconds: 2
            failureThreshold: 60
          # Appended to the image's entrypoint (node cli.js --headless
          # --browser chromium --no-sandbox).
          # --output-dir: large page snapshots and screenshots are saved as
          # files and only their path is returned, so they go to a volume
          # shared with Moltis at the same path, where the agent can read them.
          args: ["--port", "8931", "--host", "127.0.0.1", "--allowed-hosts", "*", "--isolated", "--output-dir", "/tmp/playwright"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $c.webTools.playwright.resources | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: playwright-out
              mountPath: /tmp/playwright
        {{- end }}
      containers:
        - name: moltis
          image: {{ include "moltis.instanceImage" $ctx }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["--bind", "0.0.0.0", "--port", "{{ int $c.service.port }}", "--no-tls"]
          env:
            - name: MOLTIS_BEHIND_PROXY
              value: "true"
            - name: MOLTIS_NO_TLS
              value: "true"
            {{- if $c.skipOnboarding }}
            - name: SKIP_ONBOARDING
              value: "1"
            {{- end }}
            {{- if not $c.terminal }}
            - name: MOLTIS_TERMINAL_DISABLED
              value: "true"
            {{- end }}
            {{- if or $c.password.existingSecret $c.password.value }}
            - name: MOLTIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moltis.passwordSecretName" $ctx }}
                  key: {{ $c.password.existingSecretKey }}
            {{- end }}
            {{- with $c.llm.apiKeySecret }}
            {{- if .name }}
            - name: MOLTIS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- if and $c.householdHub.enabled $c.householdHub.tokenSecret.name }}
            - name: MOLTIS_MCP_HOME_OS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.householdHub.tokenSecret.name }}
                  key: {{ $c.householdHub.tokenSecret.key }}
            {{- end }}
            # Run limits as env overrides, not only as rendered TOML: moltis
            # applies MOLTIS_* after loading the config file
            # (crates/config/src/loader/config_io.rs:789-905), so these bind an
            # instance whose moltis.toml was seeded by an earlier chart
            # version. Without them a rendered-only cap would never reach a
            # running instance (configOverwrite only seeds an empty volume).
            # Skipped when `env` already names the same var, so an explicit
            # entry never renders twice.
            {{- $envNames := list }}
            {{- range $c.env }}{{ $envNames = append $envNames .name }}{{ end }}
            {{- if not (has "MOLTIS_TOOLS__AGENT_MAX_ITERATIONS" $envNames) }}
            - name: MOLTIS_TOOLS__AGENT_MAX_ITERATIONS
              value: {{ int $c.tools.agentMaxIterations | quote }}
            {{- end }}
            {{- if not (has "MOLTIS_TOOLS__AGENT_TIMEOUT_SECS" $envNames) }}
            - name: MOLTIS_TOOLS__AGENT_TIMEOUT_SECS
              value: {{ int $c.tools.agentTimeoutSecs | quote }}
            {{- end }}
            {{- with $c.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int $c.service.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            # The image grants passwordless sudo; this makes it inert.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- include "moltis.volumeMounts" $ctx | nindent 12 }}
            - name: tmp
              mountPath: /tmp
            {{- if $c.webTools.playwright.enabled }}
            - name: playwright-out
              mountPath: /tmp/playwright
            {{- end }}
      volumes:
        {{- if $c.webTools.searxng.enabled }}
        - name: searxng-cache
          emptyDir: {}
        {{- end }}
        {{- if $c.webTools.playwright.enabled }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $c.webTools.playwright.shmSize }}
        - name: playwright-out
          emptyDir:
            sizeLimit: 512Mi
        {{- end }}
        - name: seed
          configMap:
            name: {{ $i.fullname }}-config
        - name: tmp
          emptyDir: {}
        - name: state
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "moltis.claimName" $ctx }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $i.fullname }}
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "moltis.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ int $c.service.port }}
      targetPort: http
{{- if $c.ingressRoute.enabled }}
{{- if not $c.ingressRoute.host }}
{{- fail (printf "instance %s: ingressRoute.host is required" $i.name) }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $i.fullname }}
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml $c.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ $c.ingressRoute.host }}`)
      {{- with $c.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $i.fullname }}
          port: {{ int $c.service.port }}
  {{- with $c.ingressRoute.tlsSecretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
{{- if $c.networkPolicy.enabled }}
{{- $np := $c.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $i.fullname }}
  labels:
    {{- include "moltis.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moltis.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    {{- if $np.restrictIngress }}
    - Ingress
    {{- end }}
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
  {{- if $np.restrictIngress }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
      ports:
        - port: http
  {{- end }}
  {{- if $np.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson $np.egress.blockedCIDRs }}
        - ipBlock:
            cidr: ::/0
            except: {{ toJson $np.egress.blockedCIDRsV6 }}
    {{- $allowPods := $np.egress.allowPods | default list }}
    {{- with $c.householdHub }}
    {{- if .enabled }}
    {{- $allowPods = append $allowPods (dict "namespace" .namespace "podLabels" .podLabels "ports" (list .port)) }}
    {{- end }}
    {{- end }}
    {{- range $allowPods }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
    {{- range $np.egress.allow }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
